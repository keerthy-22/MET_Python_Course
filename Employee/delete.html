<!DOCTYPE html>
<html>
<head>
    <title>Delete Employee</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:600px;
            margin:60px auto;
            background:#fff;
            border:3px solid royalblue;
            padding:20px;
        }

        h1{
            text-align:center;
            color:red;
            margin-bottom:20px;
        }

        nav{
            text-align:center;
            margin-bottom:25px;
        }

        nav a{
            text-decoration:none;
            color:blue;
            font-size:22px;
            font-weight:bold;
            margin:0 15px;
        }

        nav a:hover{
            color:red;
        }

        h2{
            text-align:center;
            color:green;
            margin-bottom:25px;
        }

        form{
            width:100%;
        }

        table{
            width:100%;
        }

        td{
            padding:15px;
            font-size:20px;
            font-weight:bold;
        }

        input[type="text"]{
            width:100%;
            padding:10px;
            font-size:18px;
            border:2px solid black;
            border-radius:5px;
        }

        .buttons{
            text-align:center;
            margin-top:20px;
        }

        .btn{
            padding:10px 25px;
            font-size:18px;
            font-weight:bold;
            border:2px solid black;
            border-radius:8px;
            background:white;
            cursor:pointer;
            margin:10px;
        }

        .btn:hover{
            background:crimson;
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="#">Contact</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="emphome.html">Employee Home</a>
    </nav>

    <h2>Delete Employee</h2>

    <form>

        <table>

            <tr>
                <td>Employee ID</td>
                <td>
                    <input type="text" placeholder="Enter Employee ID">
                </td>
            </tr>

        </table>

        <div class="buttons">
            <input type="submit" value="Delete" class="btn">
            <input type="reset" value="Clear" class="btn">
        </div>

    </form>

</div>

</body>
</html>
