<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:900px;
            margin:40px auto;
            background:#fff;
            border:3px solid royalblue;
            padding:20px;
            text-align:center;
        }

        h1{
            color:#d62828;
            margin-bottom:20px;
        }

        nav{
            margin-bottom:20px;
        }

        nav a{
            text-decoration:none;
            color:royalblue;
            font-size:22px;
            font-weight:bold;
            margin:0 18px;
        }

        nav a:hover{
            color:red;
        }

        img{
            width:500px;
            height:320px;
            border:2px solid #000;
            object-fit:cover;
        }

        form{
            width:500px;
            margin:20px auto;
            border:2px solid #000;
            padding:20px;
            text-align:left;
        }

        h2{
            text-align:center;
            color:green;
            margin-bottom:20px;
        }

        label{
            font-size:22px;
            font-weight:bold;
            display:inline-block;
            width:180px;
            margin-bottom:15px;
        }

        input,
        select,
        textarea{
            width:240px;
            padding:8px;
            font-size:18px;
            border:2px solid #000;
        }

        textarea{
            resize:none;
            height:70px;
        }

        .btn{
            padding:8px 20px;
            font-size:20px;
            font-weight:bold;
            border:2px solid #000;
            border-radius:8px;
            cursor:pointer;
            background:white;
            margin:10px;
        }

        .btn:hover{
            background:royalblue;
            color:white;
        }

        .links{
            margin-top:30px;
        }

        .links a{
            text-decoration:none;
            font-size:24px;
            color:royalblue;
            font-weight:bold;
            margin:0 20px;
        }

        .links a:hover{
            color:red;
        }

        p{
            font-size:28px;
            color:purple;
            margin:30px 0;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="#">Contact</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
    </nav>

    <img src="employee.jpg" alt="Employee">

</div>

</body>
</html>
